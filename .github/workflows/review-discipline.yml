name: Review discipline

# Reviewer-aid checks: docs-drift gate + migration safety + a diff summary.
# Kept separate from rls-tests.yml (Docker) so it stays fast and never weakens it.
# fetch-depth: 0 + an explicit fetch of the base branch guarantee a real
# merge-base; REQUIRE_BASE=1 makes the docs gate FAIL (not skip) if it's missing.

on:
  pull_request:
  workflow_dispatch:

env:
  BASE_BRANCH: ${{ github.base_ref || 'main' }}

jobs:
  review-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure base branch is available for merge-base
        run: git fetch --no-tags origin "$BASE_BRANCH"
      - name: PR review summary
        run: bash scripts/pr-review-summary.sh "origin/$BASE_BRANCH"
      - name: Migration safety
        run: bash scripts/check-migration-safety.sh
      - name: Auth safety (self-test + scan src/)
        run: |
          bash scripts/check-auth-safety.sh selftest
          bash scripts/check-auth-safety.sh
      - name: App↔runner import boundary (self-test + scan src/)
        # app stays pg-free + no Secrets-Manager; src/app holds no runner internals/KMS; KMS confined to the adapters (doc 46 §11)
        run: |
          bash scripts/check-app-runtime-imports.sh selftest
          bash scripts/check-app-runtime-imports.sh
      - name: Connector-runner deploy templates inert (self-test + scan deploy/)
        # placeholders only; no real account/ARN/KMS-id/token/DB-url; no executable deploy command; Dockerfile no secret build args
        run: |
          bash scripts/check-deploy-templates.sh selftest
          bash scripts/check-deploy-templates.sh
      - name: Runner infra preflight guards (self-test only — no AWS)
        # exercises the fail-closed guard refusals; CI never runs the live read-only preflight (no AWS creds, opt-in unset)
        run: bash scripts/check-runner-infra-preflight.sh selftest
      - name: Docs-drift gate (must not fail open)
        env:
          REQUIRE_BASE: "1"
        run: bash scripts/check-docs-updated.sh "origin/$BASE_BRANCH"
      - name: No real provider tokens committed (RISK-007)
        # selftest proves the matcher catches positives + excuses sentinels; --all then scans every tracked file
        # (robust regardless of clone depth). The scanner fails loud if perl is absent.
        run: |
          bash scripts/check-no-real-tokens.sh selftest
          bash scripts/check-no-real-tokens.sh --all
