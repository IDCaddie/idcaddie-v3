name: Review discipline

# Reviewer-aid checks: docs-drift gate + migration safety + a diff summary.
# Kept separate from rls-tests.yml (Docker) so it stays fast and never weakens it.
# Needs full history to compute the merge-base with origin/main.

on:
  pull_request:
  workflow_dispatch:

jobs:
  review-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR review summary
        run: bash scripts/pr-review-summary.sh origin/${{ github.base_ref }}
      - name: Migration safety
        run: bash scripts/check-migration-safety.sh
      - name: Docs-drift gate
        run: bash scripts/check-docs-updated.sh origin/${{ github.base_ref }}
