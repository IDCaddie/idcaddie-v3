name: Store integration test

# Brings up a LOCAL Supabase stack (Docker + Supabase CLI), applies all migrations, and runs the Slack resolver store's
# real PostgREST + RLS integration test as a tenant-member JWT (scripts/test-store-it.sh). Local-only keys; never hosted
# Supabase, never a production credential. Mirrors rls-tests.yml.

on:
  pull_request:
  workflow_dispatch:

jobs:
  store-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1 (the exact commit branch v1 resolved to; v1 is a BRANCH, not a tag)
        with:
          version: 2.102.0 # pin to the version the store IT is validated against (avoids local-stack/auth drift on "latest")
      - name: Run store integration test (local Supabase stack)
        run: npm run test:store-it
