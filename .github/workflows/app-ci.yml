name: App CI

# Build/lint/test/typecheck the Next.js app on every PR — the app's release-hygiene gate.
# Kept separate from the RLS Docker CI (rls-tests.yml) and the docs/migration checks
# (review-discipline.yml, migration-safety.yml). Needs no hosted Supabase, no secrets:
# the build is deterministic (system fonts, no remote font fetch) and all data pages are
# dynamic, so it does not read NEXT_PUBLIC_SUPABASE_* at build time.

on:
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install (clean, lockfile-exact)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Runner skeleton typecheck (separate deployable, independent of the app)
        run: npm run runner:typecheck
      - name: Build
        run: npm run build
      # The OAuth callback function must carry no forbidden runtime capability (doc 83 §2). This MUST run after the
      # build and on a clean checkout: the previous version was a vitest `it.skipIf` on `.next` existing, `npm test`
      # ran before the build, `/.next/` is gitignored — so every real assertion skipped silently on every PR while
      # reporting green. The script treats a missing build as a FAILURE, never a skip.
      - name: Callback bundle capability guard (post-build, fails if the build is absent)
        run: npm run security:bundle:check
